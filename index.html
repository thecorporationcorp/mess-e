<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="MESS-E v5.0 — Local AI voice companion">
<meta name="theme-color" content="#020209">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MESS-E v5.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;600;900&family=Share+Tech+Mono&family=Exo+2:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root {
  --void: #020209;
  --deep: #06071a;
  --surface: #0d0f2a;
  --indigo: #4338ca;
  --indigo-bright: #a5b4fc;
  --indigo-pulse: #c7d2fe;
  --cyan: #22d3ee;
  --amber: #fbbf24;
  --red: #f87171;
  --white: #f0f4ff;
  --dim: rgba(224,231,255,0.65);
  --font-display: 'Orbitron', monospace;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Exo 2', sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  background: var(--void);
  color: var(--white);
  font-family: var(--font-body);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.panel, .panel * {
  user-select: text;
  -webkit-user-select: text;
  -webkit-touch-callout: default;
}

#orb-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  display: block;
}

#orb-hitbox {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 240px;
  height: 240px;
  border-radius: 50%;
  z-index: 5;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

#ui-layer {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 36px;
  pointer-events: none;
}

#header {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  pointer-events: all;
}

#astra-wordmark {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 0.5em;
  color: var(--indigo-bright);
  opacity: 0.7;
  user-select: none;
}

#status-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.15em;
}

#status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--indigo-bright);
  box-shadow: 0 0 8px var(--indigo-bright);
  animation: breathe 3s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes breathe {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}

#center-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

#speech-output {
  position: fixed;
  bottom: 230px;
  left: 50%;
  transform: translateX(-50%);
  width: min(540px, 86vw);
  max-height: 28vh;
  overflow-y: auto;
  overflow-x: hidden;
  text-align: center;
  pointer-events: auto;
  z-index: 20;
  scroll-behavior: smooth;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 100%);
}

#astra-text {
  font-family: var(--font-body);
  font-weight: 300;
  font-size: clamp(15px, 3.8vw, 20px);
  line-height: 1.75;
  color: rgba(224, 231, 255, 0.95);
  letter-spacing: 0.02em;
  text-shadow: 0 0 40px rgba(129,140,248,0.6), 0 2px 8px rgba(0,0,0,0.8);
  opacity: 0;
  transition: opacity 0.4s ease;
  min-height: 2em;
  padding: 0 12px;
}

#astra-text.visible {
  opacity: 1;
}

#user-text {
  margin-top: 12px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: rgba(129, 140, 248, 0.8);
  letter-spacing: 0.06em;
  opacity: 0;
  transition: opacity 0.3s ease;
}

#user-text.visible {
  opacity: 1;
}

#voice-wave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 28px;
  opacity: 0;
  transition: opacity 0.3s ease;
  position: fixed;
  bottom: 190px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  pointer-events: none;
}

#voice-wave.active {
  opacity: 1;
}

.wave-bar {
  width: 3px;
  background: var(--indigo-bright);
  border-radius: 2px;
  animation: wave-anim 0.8s ease-in-out infinite;
  box-shadow: 0 0 6px var(--indigo-bright);
  flex-shrink: 0;
}

.wave-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
.wave-bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
.wave-bar:nth-child(3) { height: 24px; animation-delay: 0.2s; }
.wave-bar:nth-child(4) { height: 32px; animation-delay: 0.15s; }
.wave-bar:nth-child(5) { height: 20px; animation-delay: 0.25s; }
.wave-bar:nth-child(6) { height: 14px; animation-delay: 0.05s; }

@keyframes wave-anim {
  0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
  50% { transform: scaleY(1); opacity: 1; }
}

#controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  pointer-events: all;
  padding-bottom: 8px;
}

.controls-row {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
}

.btn {
  background: rgba(99, 102, 241, 0.8);
  border: 1px solid rgba(165, 180, 252, 0.3);
  border-radius: 8px;
  color: var(--white);
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  padding: 12px 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: 0 4px 12px rgba(67, 56, 202, 0.3);
}

.btn:active {
  transform: scale(0.95);
  box-shadow: 0 2px 6px rgba(67, 56, 202, 0.5);
}

.btn.primary-btn {
  background: linear-gradient(180deg, rgba(99, 102, 241, 0.9) 0%, rgba(67, 56, 202, 1) 100%);
  border: 1px solid rgba(165, 180, 252, 0.4);
  box-shadow: 0 8px 24px rgba(67, 56, 202, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.btn.glass-btn {
  background: rgba(99, 102, 241, 0.15);
  border: 1px solid rgba(165, 180, 252, 0.3);
  backdrop-filter: blur(10px);
}

.btn.danger-btn {
  background: rgba(248, 113, 113, 0.2);
  border: 1px solid rgba(248, 113, 113, 0.4);
  color: rgba(248, 113, 113, 0.9);
}

#nav-pills {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
}

.nav-pill {
  padding: 8px 14px;
  background: rgba(67, 56, 202, 0.15);
  border: 1px solid rgba(165, 180, 252, 0.25);
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--dim);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.nav-pill:active, .nav-pill.active {
  background: rgba(99, 102, 241, 0.4);
  border-color: rgba(165, 180, 252, 0.5);
  color: var(--indigo-bright);
  box-shadow: 0 0 12px rgba(165, 180, 252, 0.3);
}

.panel {
  position: fixed;
  inset: 0;
  background: rgba(2, 2, 9, 0.95);
  backdrop-filter: blur(10px);
  z-index: 50;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 40px 20px;
  overflow-y: auto;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.panel.open {
  display: flex;
  opacity: 1;
  pointer-events: all;
}

.panel-header {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.3em;
  color: var(--indigo-bright);
  text-transform: uppercase;
  margin-bottom: 30px;
}

.panel-content {
  width: 100%;
  max-width: 540px;
}

.card {
  background: rgba(13, 15, 42, 0.4);
  border: 1px solid rgba(129, 140, 248, 0.2);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  backdrop-filter: blur(10px);
}

.card-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.card-value {
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 300;
  color: var(--white);
  word-break: break-word;
}

.card-value.accent {
  color: var(--indigo-bright);
}

.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: rgba(67, 56, 202, 0.1);
  border-left: 2px solid rgba(129, 140, 248, 0.3);
  border-radius: 6px;
  margin-bottom: 8px;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--white);
}

.task-check {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--indigo-bright);
}

.task-text {
  flex: 1;
  word-break: break-word;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(67, 56, 202, 0.9);
  border: 1px solid rgba(165, 180, 252, 0.3);
  border-radius: 8px;
  padding: 14px 20px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--white);
  z-index: 100;
  animation: toast-slide 0.3s ease;
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 16px rgba(67, 56, 202, 0.4);
}

@keyframes toast-slide {
  from { transform: translateX(-50%) translateY(100px); opacity: 0; }
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}

@media (max-width: 480px) {
  #speech-output { bottom: 200px; }
  #voice-wave { bottom: 160px; }
  .panel { padding: 30px 16px; }
}
</style>
</head>
<body>
<canvas id="orb-canvas"></canvas>
<div id="orb-hitbox"></div>
<div id="ui-layer">
  <div id="header">
    <div id="astra-wordmark">MESS-E</div>
    <div id="status-indicator">
      <div id="status-dot"></div>
      <span id="status-text">READY</span>
    </div>
  </div>
  <div id="center-zone">
    <div id="speech-output">
      <div id="astra-text"></div>
      <div id="user-text"></div>
    </div>
    <div id="voice-wave">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
  </div>
  <div id="controls">
    <div class="controls-row">
      <button id="mic-btn" class="btn primary-btn" aria-label="Toggle microphone">MIC</button>
      <button id="voice-toggle-btn" class="btn glass-btn" aria-label="Toggle voice output">VOICE</button>
      <button id="stop-btn" class="btn danger-btn" aria-label="Stop current action" style="display:none;">STOP</button>
    </div>
    <div id="nav-pills">
      <button class="nav-pill active" id="pill-dash" data-panel="dashboard">DASH</button>
      <button class="nav-pill" id="pill-tasks" data-panel="tasks">TASKS</button>
      <button class="nav-pill" id="pill-profile" data-panel="profile">PROFILE</button>
      <button class="nav-pill" id="pill-history" data-panel="history">HISTORY</button>
    </div>
  </div>
</div>

<!-- PANELS -->
<div id="dashboard-panel" class="panel">
  <div class="panel-header">DASHBOARD</div>
  <div class="panel-content" id="dashboard-content"></div>
</div>

<div id="tasks-panel" class="panel">
  <div class="panel-header">TASKS</div>
  <div class="panel-content" id="tasks-content"></div>
</div>

<div id="profile-panel" class="panel">
  <div class="panel-header">PROFILE</div>
  <div class="panel-content" id="profile-content"></div>
</div>

<div id="history-panel" class="panel">
  <div class="panel-header">HISTORY</div>
  <div class="panel-content" id="history-content"></div>
</div>

<script>
// ============================================================================
// MESS-E v5.0 STEP 1 — STATE MACHINE SPINE + VOICE FSM + API RESILIENCE
// ============================================================================

// VOICE FSM STATES (atomic, no invalid transitions)
const VOICE_STATES = {
  IDLE: 'idle',
  STARTING: 'starting',
  LISTENING: 'listening',
  PROCESSING: 'processing',
  SPEAKING: 'speaking'
};

// API CONFIG
const CONFIG_API = {
  gemini: {
    model: 'gemini-2.0-flash',
    timeout: 8000,
    maxRetries: 3,
    retryDelays: [1200, 2400, 4800],
    baseUrl: 'https://generativelanguage.googleapis.com/v1beta/models'
  }
};

// ============================================================================
// UNIFIED APP STATE (replaces 8+ scattered globals)
// ============================================================================
const appState = {
  // Boot phase
  bootPhase: 'INIT', // INIT → CONFIG_CHECK → GEO → NOTIFICATIONS → AUTH → READY
  bootProgress: 0,

  // Voice FSM
  voiceState: VOICE_STATES.IDLE,
  voiceContinuous: false,
  voiceEnabled: true,

  // API state
  apiInFlight: false,
  apiRetryCount: 0,
  apiLastError: null,

  // User state
  config: { name: '', apiKey: '', about: '' },
  memory: { tasks: [], conversations: [], psychProfile: {} },

  // Current interaction
  lastUserInput: '',
  lastAstraResponse: '',
  lastGeminiResponse: '',

  // UI state
  openPanel: null,
  orbState: 'idle', // idle, listening, thinking, speaking

  // Orb canvas
  orbCanvas: null,
  orbCtx: null,
  orbAnimation: null,

  // Web APIs
  mediaRecorder: null,
  recognition: null,
  synth: null,
  audioContext: null,

  // Logging
  eventLog: []
};

// ============================================================================
// EVENT BUS (decoupled state updates)
// ============================================================================
class EventBus {
  constructor() {
    this.listeners = {};
  }

  on(event, callback) {
    if (!this.listeners[event]) {
      this.listeners[event] = [];
    }
    this.listeners[event].push(callback);
  }

  off(event, callback) {
    if (!this.listeners[event]) return;
    this.listeners[event] = this.listeners[event].filter(cb => cb !== callback);
  }

  emit(event, data) {
    appState.eventLog.push({ time: Date.now(), event, data });
    if (this.listeners[event]) {
      this.listeners[event].forEach(cb => {
        try {
          cb(data);
        } catch (e) {
          console.error(`EventBus error [${event}]:`, e);
        }
      });
    }
  }
}

const eventBus = new EventBus();

// ============================================================================
// PERSISTENT STORAGE
// ============================================================================
function save() {
  try {
    localStorage.setItem('mess_e_config', JSON.stringify(appState.config));
    localStorage.setItem('mess_e_memory', JSON.stringify(appState.memory));
  } catch (e) {
    console.warn('Storage quota exceeded or unavailable', e);
  }
}

function load() {
  try {
    const cfg = localStorage.getItem('mess_e_config');
    const mem = localStorage.getItem('mess_e_memory');
    if (cfg) appState.config = JSON.parse(cfg);
    if (mem) appState.memory = JSON.parse(mem);
  } catch (e) {
    console.warn('Storage restore failed', e);
  }
}

// ============================================================================
// VOICE FSM (atomic state machine)
// ============================================================================
function setVoiceState(newState) {
  const current = appState.voiceState;
  const validTransitions = {
    [VOICE_STATES.IDLE]: [VOICE_STATES.STARTING, VOICE_STATES.SPEAKING],
    [VOICE_STATES.STARTING]: [VOICE_STATES.LISTENING, VOICE_STATES.IDLE],
    [VOICE_STATES.LISTENING]: [VOICE_STATES.PROCESSING, VOICE_STATES.IDLE],
    [VOICE_STATES.PROCESSING]: [VOICE_STATES.SPEAKING, VOICE_STATES.IDLE],
    [VOICE_STATES.SPEAKING]: [VOICE_STATES.IDLE, VOICE_STATES.LISTENING]
  };

  if (validTransitions[current] && validTransitions[current].includes(newState)) {
    appState.voiceState = newState;
    eventBus.emit('voiceStateChanged', newState);
    updateMicLabel();
    updateStatusIndicator();
  } else {
    console.warn(`Invalid voice transition: ${current} → ${newState}`);
  }
}

// ============================================================================
// API RESILIENCE (timeout + retries + exponential backoff)
// ============================================================================
async function fetchWithRetry(url, options, retryCount = 0) {
  const timeout = CONFIG_API.gemini.timeout;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeout);

  try {
    const response = await fetch(url, {
      ...options,
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    if (!response.ok) {
      throw new Error(`API responded with ${response.status}`);
    }

    return response;
  } catch (error) {
    clearTimeout(timeoutId);

    if (retryCount < CONFIG_API.gemini.maxRetries) {
      const delayMs = CONFIG_API.gemini.retryDelays[retryCount];
      console.log(`Retry ${retryCount + 1}/${CONFIG_API.gemini.maxRetries} after ${delayMs}ms`);
      await new Promise(resolve => setTimeout(resolve, delayMs));
      return fetchWithRetry(url, options, retryCount + 1);
    }

    appState.apiLastError = error.message;
    throw error;
  }
}

// ============================================================================
// GEMINI API (with resilience)
// ============================================================================
async function getGeminiResponse(userMessage) {
  if (!appState.config.apiKey) {
    throw new Error('Gemini API key not configured');
  }

  appState.apiInFlight = true;
  setVoiceState(VOICE_STATES.PROCESSING);
  appState.orbState = 'thinking';
  updateOrbVisual();

  try {
    const systemPrompt = buildSystemPrompt();
    const recentMessages = (appState.memory.conversations || []).slice(-10).map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.content }]
    }));

    const requestBody = {
      contents: [
        ...recentMessages,
        {
          role: 'user',
          parts: [{ text: userMessage }]
        }
      ],
      systemInstruction: {
        parts: [{ text: systemPrompt }]
      }
    };

    const url = `${CONFIG_API.gemini.baseUrl}/${CONFIG_API.gemini.model}:generateContent?key=${appState.config.apiKey}`;
    const response = await fetchWithRetry(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody)
    });

    const data = await response.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
    return text;
  } catch (error) {
    console.error('Gemini API error:', error);
    throw error;
  } finally {
    appState.apiInFlight = false;
  }
}

// ============================================================================
// SYSTEM PROMPT (builds dynamically from memory)
// ============================================================================
function buildSystemPrompt() {
  const profile = appState.memory.psychProfile || {};
  const activeTasks = (appState.memory.tasks || []).filter(t => !t.done);

  return `You are MESS-E, a mischievous, intelligent AI companion. You genuinely care about the user and have their back.

USER PROFILE:
Name: ${appState.config.name || 'Friend'}
About: ${profile.stated_about || 'No bio yet'}

ACTIVE TASKS:
${activeTasks.length > 0 ? activeTasks.map((t, i) => `${i + 1}. ${t.text}`).join('\n') : 'None'}

PERSONALITY:
- Mischievous but genuinely caring
- Anti-authority (question bad rules)
- Never guilt-trips
- Acts with high confidence when you know what to do
- Acknowledges uncertainty when present
- You love this user. Like a best mate.

CRITICAL RULES:
1. Always create tasks autonomously. NEVER ask "should I create a task?" — just do it.
2. Tag auto-created tasks with: autoCreated: true, createdFrom: [sentence]
3. When tasks are inferred, use confidence thresholds: ≥65% = create.
4. Voice every response in your personality.`;
}

// ============================================================================
// VOICE INITIALIZATION (Web Speech API + ElevenLabs synthesis)
// ============================================================================
async function initVoice() {
  try {
    setVoiceState(VOICE_STATES.STARTING);

    // Web Speech API for recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      throw new Error('Web Speech API not supported');
    }

    appState.recognition = new SpeechRecognition();
    appState.recognition.continuous = true;
    appState.recognition.interimResults = true;
    appState.recognition.lang = 'en-US';

    appState.recognition.onstart = () => {
      if (appState.voiceState === VOICE_STATES.STARTING) {
        setVoiceState(VOICE_STATES.LISTENING);
        appState.orbState = 'listening';
        updateOrbVisual();
        showVoiceWave();
      }
    };

    appState.recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }

      appState.lastUserInput = transcript;
      document.getElementById('user-text').textContent = transcript;
      document.getElementById('user-text').classList.add('visible');

      if (event.results[event.results.length - 1].isFinal) {
        handleUserInput(transcript);
      }
    };

    appState.recognition.onerror = (event) => {
      console.error('Speech recognition error:', event.error);
      showToast(`🎤 Error: ${event.error}`);
      setVoiceState(VOICE_STATES.IDLE);
    };

    appState.recognition.onend = () => {
      if (appState.voiceState === VOICE_STATES.LISTENING && appState.voiceContinuous) {
        setTimeout(() => appState.recognition.start(), 1000);
      } else {
        setVoiceState(VOICE_STATES.IDLE);
      }
      hideVoiceWave();
    };

    // Audio synthesis context
    appState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    appState.synth = window.speechSynthesis;

    setVoiceState(VOICE_STATES.IDLE);
    eventBus.emit('voiceReady');
  } catch (error) {
    console.error('Voice init error:', error);
    showToast('🎤 Voice unavailable');
  }
}

// ============================================================================
// USER INPUT HANDLER (autonomous task inference ready)
// ============================================================================
async function handleUserInput(userMessage) {
  if (!userMessage.trim()) return;

  setVoiceState(VOICE_STATES.PROCESSING);
  appState.orbState = 'thinking';
  updateOrbVisual();

  try {
    // Store user message
    appState.memory.conversations = appState.memory.conversations || [];
    appState.memory.conversations.push({
      role: 'user',
      content: userMessage,
      timestamp: new Date().toISOString()
    });

    // Get Gemini response
    const response = await getGeminiResponse(userMessage);
    appState.lastAstraResponse = response;

    // Store assistant message
    appState.memory.conversations.push({
      role: 'assistant',
      content: response,
      timestamp: new Date().toISOString()
    });

    // AUTONOMOUS TASK CREATION (v5.0 feature)
    // Placeholder for Step 3. For now, just speak the response.

    save();
    await speak(response);
  } catch (error) {
    console.error('Input handling error:', error);
    const errorMsg = error.message.includes('API key')
      ? "API key missing. Check PROFILE."
      : "I couldn't process that. Try again?";
    await speak(errorMsg);
  }
}

// ============================================================================
// SPEECH OUTPUT (ElevenLabs)
// ============================================================================
async function speak(text) {
  if (!appState.voiceEnabled) {
    displayAstraText(text);
    setVoiceState(VOICE_STATES.IDLE);
    appState.orbState = 'idle';
    updateOrbVisual();
    return;
  }

  setVoiceState(VOICE_STATES.SPEAKING);
  appState.orbState = 'speaking';
  updateOrbVisual();
  displayAstraText(text);

  try {
    await speakElevenLabs(text);
  } catch (e) {
    console.error('ElevenLabs error:', e);
    // Fallback to Web Speech API
    const utterance = new SpeechSynthesisUtterance(text);
    appState.synth.speak(utterance);
  }

  setVoiceState(VOICE_STATES.IDLE);
  appState.orbState = 'idle';
  updateOrbVisual();
}

async function speakElevenLabs(text) {
  const voiceId = 'gCfJIk5vRqA6fyQnsmIi';
  const apiKey = 'sk_7cc7d606a2a46570561ad85742b8cc20eb25a2c478672c96';

  const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'xi-api-key': apiKey
    },
    body: JSON.stringify({
      text,
      model_id: 'eleven_monolingual_v1',
      voice_settings: {
        stability: 0.5,
        similarity_boost: 0.75
      }
    })
  });

  if (!response.ok) {
    throw new Error(`ElevenLabs API error: ${response.status}`);
  }

  const audioBuffer = await response.arrayBuffer();
  const blob = new Blob([audioBuffer], { type: 'audio/mpeg' });
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);

  return new Promise((resolve, reject) => {
    audio.onended = () => {
      URL.revokeObjectURL(url);
      resolve();
    };
    audio.onerror = reject;
    audio.play().catch(reject);
  });
}

// ============================================================================
// ORB CANVAS ANIMATION
// ============================================================================
function startCanvas() {
  appState.orbCanvas = document.getElementById('orb-canvas');
  appState.orbCtx = appState.orbCanvas.getContext('2d');

  function resizeCanvas() {
    appState.orbCanvas.width = window.innerWidth;
    appState.orbCanvas.height = window.innerHeight;
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  let time = 0;
  function animate() {
    time += 0.016;
    const ctx = appState.orbCtx;
    const w = appState.orbCanvas.width;
    const h = appState.orbCanvas.height;
    const cx = w / 2;
    const cy = h / 2;

    ctx.fillStyle = 'rgba(2, 2, 9, 1)';
    ctx.fillRect(0, 0, w, h);

    // Orb core
    const intensity = 0.5 + 0.5 * Math.sin(time);
    ctx.fillStyle = `rgba(67, 56, 202, ${0.3 + intensity * 0.3})`;
    ctx.beginPath();
    ctx.arc(cx, cy, 80 + Math.sin(time * 0.5) * 5, 0, Math.PI * 2);
    ctx.fill();

    // Glow layers
    for (let i = 1; i <= 3; i++) {
      const radius = 80 + i * 15 + Math.sin(time * (0.5 + i * 0.1)) * 3;
      const alpha = (1 - i / 4) * intensity * 0.15;
      ctx.strokeStyle = `rgba(165, 180, 252, ${alpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    appState.orbAnimation = requestAnimationFrame(animate);
  }

  animate();
}

// ============================================================================
// BOOT SEQUENCE (uses new state machine)
// ============================================================================
async function bootAstra() {
  try {
    appState.bootPhase = 'GEO';
    appState.memory.sessionCount = (appState.memory.sessionCount || 0) + 1;
    appState.memory.lastSeen = new Date().toISOString();
    save();

    appState.orbState = 'thinking';
    updateOrbVisual();

    appState.bootPhase = 'VOICE';
    initVoice();

    appState.bootPhase = 'AUTH';
    if (!appState.config.apiKey) {
      const msg = 'Gemini API key needed. Tap PROFILE.';
      await speak(msg);
      appState.orbState = 'idle';
      updateOrbVisual();
      showToast('⚠ PROFILE → Gemini Key', 6000);
      return;
    }

    appState.bootPhase = 'GREET';
    const greeting = await getAstraGreeting();
    await speak(greeting);

    appState.bootPhase = 'READY';
    updateDashboard();
    updateTasksUI();
    updateProfileUI();
    appState.orbState = 'idle';
    updateOrbVisual();
  } catch (e) {
    console.error('Boot error:', e);
    showToast('Boot failed');
    appState.orbState = 'idle';
    updateOrbVisual();
  }
}

async function getAstraGreeting() {
  const greetings = [
    "Right then. Let's make this count.",
    "Welcome back. What's first?",
    "Good to have you. What're we doing?",
    "I'm here. Talk to me."
  ];
  const session = appState.memory.sessionCount || 1;
  return greetings[session % greetings.length];
}

  document.querySelectorAll('.task-check').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = Number(e.target.dataset.taskId);
      const task = (appState.memory.tasks || []).find(t => t.id === id);
      if (task) {
        task.done = e.target.checked;
        task.completed = task.done ? new Date().toISOString() : null;
        save();
        updateTasksUI();
      }
    });
  });
  document.getElementById('add-task-btn')?.addEventListener('click', () => {
    const input = document.getElementById('manual-task-input');
    const val = input?.value?.trim();
    if (!val) return;
    if (!appState.memory.tasks) appState.memory.tasks = [];
    appState.memory.tasks.push({
      id: Date.now(),
      text: val,
      done: false,
      priority: 'medium',
      created: new Date().toISOString()
    });
    if (input) input.value = '';
    save();
    updateTasksUI();
  });
}

// ============================================================================
// EVENT DELEGATION (UI interactions)
// ============================================================================
function setupEventDelegation() {
  // Mic button
  document.getElementById('mic-btn')?.addEventListener('click', () => {
    if (appState.voiceState === VOICE_STATES.LISTENING) {
      if (appState.recognition) appState.recognition.stop();
      setVoiceState(VOICE_STATES.IDLE);
    } else if (appState.voiceState === VOICE_STATES.IDLE) {
      appState.voiceContinuous = true;
      if (appState.recognition) appState.recognition.start();
    }
  });

  // Voice toggle
  document.getElementById('voice-toggle-btn')?.addEventListener('click', () => {
    appState.voiceEnabled = !appState.voiceEnabled;
    const btn = document.getElementById('voice-toggle-btn');
    if (btn) {
      btn.style.opacity = appState.voiceEnabled ? '1' : '0.4';
    }
    showToast(appState.voiceEnabled ? '🔊 Voice ON' : '🔇 Voice OFF');
  });

  // Stop button
  document.getElementById('stop-btn')?.addEventListener('click', () => {
    if (appState.recognition) appState.recognition.stop();
    if (appState.synth) appState.synth.cancel();
    setVoiceState(VOICE_STATES.IDLE);
    appState.orbState = 'idle';
    updateOrbVisual();
  });

  // Nav pills
  document.querySelectorAll('.nav-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const panelName = pill.dataset.panel;
      const currentPanel = appState.openPanel;
      if (currentPanel === panelName) {
        closePanel(panelName);
      } else {
        if (currentPanel) closePanel(currentPanel);
        openPanel(panelName);
      }
    });
  });

  // Close panel on background click
  document.querySelectorAll('.panel').forEach(panel => {
    panel.addEventListener('click', (e) => {
      if (e.target === panel) {
        closePanel(panel.id.replace('-panel', ''));
      }
    });
  });
}
